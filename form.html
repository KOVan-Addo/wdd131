<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Kelvin Offei Van-Addo">
    <meta name="description"
        content="Submit a product review by selecting a product, rating its quality, and sharing your experience.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review | WDD 131 | Kelvin Offei Van-Addo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>

        <p class="required-note">
            <span class="required">*</span> Required field
        </p>

        <form method="get" action="review.html">

            <fieldset>
                <label for="productName">
                    Product Name
                    <span class="required" aria-hidden="true">*</span>
                    <span class="visually-hidden">Required</span>
                </label>

                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>
                    Overall Rating
                    <span class="required" aria-hidden="true">*</span>
                    <span class="visually-hidden">Required</span>
                </legend>

                <div class="rating">

                    <label for="rating1">
                        ☆
                        <span class="visually-hidden">1 star</span>
                    </label>
                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating2">
                        ☆☆
                        <span class="visually-hidden">2 stars</span>
                    </label>
                    <input type="radio" id="rating2" name="rating" value="2" required>

                    <label for="rating3">
                        ☆☆☆
                        <span class="visually-hidden">3 stars</span>
                    </label>
                    <input type="radio" id="rating3" name="rating" value="3" required>

                    <label for="rating4">
                        ☆☆☆☆
                        <span class="visually-hidden">4 stars</span>
                    </label>
                    <input type="radio" id="rating4" name="rating" value="4" required>

                    <label for="rating5">
                        ☆☆☆☆☆
                        <span class="visually-hidden">5 stars</span>
                    </label>
                    <input type="radio" id="rating5" name="rating" value="5" required>

                </div>
            </fieldset>

            <fieldset>

                <label for="installationDate">
                    Date of Installation
                    <span class="required" aria-hidden="true">*</span>
                    <span class="visually-hidden">Required</span>
                </label>

                <input type="date" id="installationDate" name="installationDate" required>

            </fieldset>

            <fieldset>

                <legend>
                    Which features did you find useful?
                    <em>(Check all that apply)</em>
                </legend>

                <label for="durability">
                    <input type="checkbox" id="durability" name="features" value="Durability">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox" id="performance" name="features" value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox" id="design" name="features" value="Design">
                    Design
                </label>

            </fieldset>

            <fieldset>

                <label for="writtenReview">
                    Written Review
                    <span class="optional">(Optional)</span>
                </label>

                <textarea id="writtenReview" name="writtenReview" rows="6"></textarea>

            </fieldset>

            <fieldset>

                <label for="userName">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>

                <input type="text" id="userName" name="userName">

            </fieldset>

            <input type="submit" value="Post Review">

        </form>

    </main>

    <footer>

        <p>
            &copy;<span id="currentyear"></span>
            Kelvin Offei Van-Addo 🇬🇭 Ghana
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
